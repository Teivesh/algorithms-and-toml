[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithms-and-toml"
version = "0.1.0"
description = "Educational data structures, sorting algorithms, and TOML to JSON conversion"
requires-python = ">=3.11"

[project.scripts]
toml-to-json = "algorithms_and_toml.toml_json:main"

[tool.setuptools.packages.find]
where = ["src"]
